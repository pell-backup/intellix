syntax = "proto3";
package intellix.price;

import "gogoproto/gogo.proto";
import "intellix/price/task.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";

option go_package = "intellix/x/price/types";

service DvsPostProcessRequest {
  // PostProcessRequestPriceFeed defines avsi logic processing
  rpc PostProcessRequestPriceFeed(PostProcessPriceFeedMsg) returns (ResponsePostRequestPriceFeed) {}
}

// PostPriceFeedMsg defines post-price-feed request message
message PostProcessPriceFeedMsg {
  option (cosmos_proto.implements_interface) = "cosmos.base.v1beta1.Msg";
  option (amino.name) = "intellix/x/price/dvs/post_price_feed";

  // same as ProcessPriceFeedMsg as context to router
  TaskRequestRaw raw = 1;
  int64 height = 2;
  string chain_id = 3[
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  bytes data = 4;

  // validated data
  RequestPostRequestPriceFeedValidatedData validated_data = 5;
}

// AggregatedRequestPrice
message AggregatedRequestPrice {
  bytes request_id = 1;
  // Aggregated final price
  string price = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // Timestamp when aggregation was completed
  int64 timestamp = 3;
  // Number of data sources participated in aggregation
  int32 source_count = 4;
  // Number of operators participated in aggregation
  int32 operator_count = 5;
  // Block height at which aggregation was completed
  uint64 block_height = 6;
  // Block range used for aggregation
  BlockRange block_range = 7;
}

// BlockRange defines the range of blocks used for price aggregation
message BlockRange {
  // Start block height for aggregation
  uint64 start = 1;
  // End block height for aggregation
  uint64 end = 2;
}

message G1Point {
  bytes x = 1;
  bytes y = 2;
}

message G2Point {
  bytes x_real = 1;
  bytes x_imag = 2;
  bytes y_real = 3;
  bytes y_imag = 4;
}

message Signature {
  bytes sig = 1;
}

// UInt32List [][]uint32
message UInt32List {
  repeated uint32 values = 1;
}

message RequestPostRequestPriceFeedValidatedData {
  bytes data = 1;
  string error = 2;
  bytes hash = 3;
  repeated G1Point non_signers_pubkeys_g1 = 4;
  repeated G1Point quorum_apks_g1 = 5;
  G2Point signers_apk_g2 = 6;
  Signature signers_agg_sig_g1 = 7;
  repeated uint32 non_signer_quorum_bitmap_indices = 8;
  repeated uint32 quorum_apk_indices = 9;
  repeated uint32 total_stake_indices = 10;
  repeated UInt32List non_signer_stake_indices = 11;
}

message ResponsePostRequestPriceFeed {
  bytes receipt = 1;
}