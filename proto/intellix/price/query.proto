syntax = "proto3";
package intellix.price;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "intellix/price/params.proto";

option go_package = "intellix/x/price/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/intellix/price/params";
  }

  // Query VoteRequestPriceFeed
  rpc QueryVoteRequestPriceFeed(QueryVoteRequestPriceFeedReq) returns (QueryVoteRequestPriceFeedResp) {
    option (google.api.http).get = "/intellix/price/vote_request";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message QueryVoteRequestPriceFeedReq {
  string operator_id = 1;
  bytes request_id = 2;
}

message QueryVoteRequestPriceFeedResp {
  uint32 task_index = 1;
  string operator_id = 2;
  bytes request_id = 3;
  string base_symbol = 4;
  string quote_symbol = 5;
  repeated VoteRequestPriceFeedPrice price = 6;
  int64 timestamp = 7;
  uint64 block_height = 8;
  string sender = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes bls_signature = 10;
}

message VoteRequestPriceFeedPrice {
  string source = 1;
  string price = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}
