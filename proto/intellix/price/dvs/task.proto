syntax = "proto3";
package intellix.price.dvs;

import "gogoproto/gogo.proto";

option go_package = "intellix/price/dvs/types";

// TODO: This proto file belongs to DVS module rather than cosmos-sdk module.
// Need to reorganize the directory structure to separate DVS protos from
// cosmos-sdk module protos for better maintainability and clearer module
// boundaries.

// TaskRequest represents a task execution request with payment and callback
// details.
message TaskRequest {
  uint32 task_index = 1;
  bytes request_id = 2;
  string fee_token = 3;
  string payment = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];

  bytes request_data = 5;
  string callback_address = 6;
  bytes callback_function_id = 7;
  uint32 task_created_block = 8;
  bytes quorum_numbers = 9;
  uint32 quorum_threshold_percentage = 10;
  bool advance_decode = 11;
}

// PriceFeedParam defines the trading pair for price feed requests.
message PriceFeedParam {
  string base_symbol = 1;
  string quote_symbol = 2;
}
