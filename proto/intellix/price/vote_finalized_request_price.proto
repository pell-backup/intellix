syntax = "proto3";
package intellix.price;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "intellix/x/price/types";

// MsgVoteFinalizedRequestPrice represents a message for submitting finalized
// price votes. Contains the aggregated price data and associated task
// information for final price determination.
message MsgVoteFinalizedRequestPrice {
  option (cosmos.msg.v1.signer) = "sender";
  option (cosmos_proto.implements_interface) = "cosmos.base.v1beta1.Msg";

  uint32 task_index = 1; // Index of the current task
  bytes request_id = 2;  // Unique identifier for the request
  string fee_token = 3;  // Token used for fee payment
  string payment = 4 [                  // Amount to be paid for execution
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  bytes request_data = 5;                  // Original request data
  string callback_address = 6;             // Address to receive results
  bytes callback_function_id = 7;          // Function to be called with results
  uint32 task_created_block = 8;           // Block height of task creation
  bytes quorum_numbers = 9;                // Quorum validation data
  uint32 quorum_threshold_percentage = 10; // Required threshold for quorum

  uint32 reference_task_index = 11; // Reference to original task index
  bytes price = 12 [                    // Finalized price value
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string sender = 13 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}
