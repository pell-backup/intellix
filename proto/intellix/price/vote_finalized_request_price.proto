syntax = "proto3";
package intellix.price;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "intellix/price/task.proto";
import "intellix/pelldvs/dvs_post_process_validated.proto";

option go_package = "intellix/x/price/types";

message MsgVoteFinalizedRequestPrice {
  option (cosmos_proto.implements_interface) = "cosmos.base.v1beta1.Msg";

  TaskRequest task = 1;
  pelldvs.RequestPostRequestValidatedData validated_data = 2;
  PriceFeedResponse price_feed_response = 3;
}

message PriceFeedResponse {
  uint32 reference_task_index = 1;
  bytes price = 2[
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}