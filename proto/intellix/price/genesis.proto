syntax = "proto3";
package intellix.price;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "intellix/price/params.proto";

option go_package = "intellix/x/price/types";

// GenesisState defines the price module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
