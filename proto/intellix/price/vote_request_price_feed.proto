syntax = "proto3";
package intellix.price;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "intellix/x/price/types";

message MsgVoteRequestPriceFeed {
  option (cosmos.msg.v1.signer) = "sender";
  option (cosmos_proto.implements_interface) = "cosmos.base.v1beta1.Msg";

  uint32 task_index = 1;
  string operator_id = 2;
  bytes request_id = 3;
  string base_symbol = 4;
  string quote_symbol = 5;
  repeated VoteRequestPriceFeed price = 6;
  int64 timestamp = 7;
  uint64 block_height = 8;
  string sender = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes bls_signature = 10;
}

message VoteRequestPriceFeed {
  string source = 1;
  string price = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}
