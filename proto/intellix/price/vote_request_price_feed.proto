syntax = "proto3";
package intellix.price;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "intellix/x/price/types";

// MsgVoteRequestPriceFeed represents a message for submitting price feed votes.
// Contains price data from various sources for a specific trading pair.
message MsgVoteRequestPriceFeed {
  option (cosmos.msg.v1.signer) = "sender";
  option (cosmos_proto.implements_interface) = "cosmos.base.v1beta1.Msg";

  uint32 task_index = 1;
  string operator_id = 2;
  bytes request_id = 3;
  string base_symbol = 4;
  string quote_symbol = 5;
  repeated VoteRequestPriceFeed prices = 6;
  int64 timestamp = 7;
  uint64 block_height = 8;
  string sender = 9 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// VoteRequestPriceFeed represents a single price feed entry from a specific
// source.
message VoteRequestPriceFeed {
  string source = 1;
  string price = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}
