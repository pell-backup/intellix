syntax = "proto3";
package intellix.price;

import "gogoproto/gogo.proto";

option go_package = "intellix/x/price/types";

// TaskType defines the type of task
enum TaskType {
  UNSPECIFIED = 0; // Unspecified
  PRICE_FEED = 1;  // Price Feed
}

// TaskRequest defines a request for a task
message TaskRequest {
  uint32 task_index = 1;
  bytes request_id = 2;
  string fee_token = 3;
  string payment = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  bytes request_data = 5;
  string callback_address = 6;
  bytes callback_function_id = 7;
  uint32 task_created_block = 8;
  bytes quorum_numbers = 9;
  uint32 quorum_threshold_percentage = 10;
  // task_type defines the type of task for avsi router
  TaskType task_type = 11;
}
