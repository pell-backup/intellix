syntax = "proto3";
package intellix.price;

import "gogoproto/gogo.proto";

option go_package = "intellix/x/price/types";

service Dvs {
  // ProcessRequestPriceFeed defines avsi logic processing
  rpc ProcessRequestPriceFeed(RequestProcessRequestPriceFeed) returns (ResponseProcessRequestPriceFeed) {}

  // PostRequestPriceFeed defines avsi logic processing
  rpc PostRequestPriceFeed(RequestPostRequestPriceFeed) returns (ResponsePostRequestPriceFeed) {}
}

// TaskType defines the type of task
enum TaskType {
  UNSPECIFIED = 0; // Unspecified
  PRICE_FEED = 1;  // Price Feed
}

// TaskRequest defines a request for a task
message TaskRequest {
  uint32 task_index = 1;
  bytes request_id = 2;
  string fee_token = 3;
  string payment = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  bytes request_data = 5;
  string callback_address = 6;
  bytes callback_function_id = 7;
  uint32 task_created_block = 8;
  bytes quorum_numbers = 9;
  uint32 quorum_threshold_percentage = 10;
  // task_type defines the type of task for avsi router
  TaskType task_type = 11;
}

message RequestProcessRequestPriceFeed {
  TaskRequest task = 1;
  int64 height = 2;
  string chain_id = 3[
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// AggregatedRequestPrice
message AggregatedRequestPrice {
  bytes request_id = 1;
  // Aggregated final price
  string price = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // Timestamp when aggregation was completed
  int64 timestamp = 3;
  // Number of data sources participated in aggregation
  int32 source_count = 4;
  // Number of operators participated in aggregation
  int32 operator_count = 5;
  // Block height at which aggregation was completed
  uint64 block_height = 6;
  // Block range used for aggregation
  BlockRange block_range = 7;
}

// BlockRange defines the range of blocks used for price aggregation
message BlockRange {
  // Start block height for aggregation
  uint64 start = 1;
  // End block height for aggregation
  uint64 end = 2;
}

message ResponseProcessRequestPriceFeed {
  AggregatedRequestPrice price = 1;
  bytes PriceDigest = 2;
}

message RequestPostRequestPriceFeed{
  TaskRequest task = 1;
}

message ResponsePostRequestPriceFeed {

}