syntax = "proto3";
package intellix.processor;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "intellix/x/processor/types";

// MsgVoteRequestProcessor represents a message for processor request voting.
// Contains all necessary information for processing and validating a vote
// request, including task details, payment information, and callback
// specifications.
message MsgVoteRequestProcessor {
  option (cosmos.msg.v1.signer) = "sender";
  option (cosmos_proto.implements_interface) = "cosmos.base.v1beta1.Msg";
  option (amino.name) = "intellix/x/processor/MsgVoteRequestProcessor";

  uint32 task_index = 1;
  bytes request_id = 2;
  string fee_token = 3;
  string payment = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  bytes request_data = 5;
  string callback_address = 6;
  bytes callback_function_id = 7;
  uint32 task_created_block = 8;
  bytes quorum_numbers = 9;
  uint32 quorum_threshold_percentage = 10;
  uint64 script_id = 11;
  bytes script_resp = 12;
  string sender = 13 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}

// MsgVoteRequestProcessorResponse defines the response structure for
// a vote request processor message. Currently empty as no response data is
// needed.
message MsgVoteRequestProcessorResponse {}
