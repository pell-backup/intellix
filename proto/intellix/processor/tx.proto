syntax = "proto3";
package intellix.processor;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "intellix/processor/params.proto";
import "intellix/processor/processor.proto";
import "intellix/processor/vote_request_processor.proto";
import "intellix/processor/vote_response_processor.proto";

option go_package = "intellix/x/processor/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // CreateProcessor creates a processor with given config and code.
  rpc CreateProcessor(MsgCreateProcessor) returns (MsgCreateProcessorResponse);

  // VoteRequestProcessor votes for a request
  rpc VoteRequestProcessor(MsgVoteRequestProcessor)
      returns (MsgVoteRequestProcessorResponse);
  // VoteResponseProcessor votes for a response
  rpc VoteResponseProcessor(MsgVoteResponseProcessor)
      returns (MsgVoteResponseProcessorResponse);
}

// MsgUpdateParams represents a message to update the module parameters.
// It includes the authority address and new parameter values that will replace
// the existing module parameters.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "intellix/x/processor/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // params defines the module parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message. Currently empty as no response data is needed.
message MsgUpdateParamsResponse {}

// MsgCreateProcessor represents a message to create a new processor.
// Contains the necessary information for initializing a processor including
// its type, configuration, and WASM code.
message MsgCreateProcessor {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  ProcessorType processor_type = 2;
  bytes config = 3;
  bytes wasm_code = 4;
}

// MsgCreateProcessorResponse defines the response structure for
// a processor creation message, containing the ID of the newly created
// processor.
message MsgCreateProcessorResponse { uint64 id = 1; }
