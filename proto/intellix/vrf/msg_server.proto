syntax = "proto3";
package intellix.vrf;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";

option go_package = "intellix/dvs/vrf/types";

service VRFMsgRequest {
  rpc HandleVRFRandomNumberRequest(GenerateRandomNumberRequest) returns (GenerateRandomNumberResponse) {}
}

service VRFMsgResponse {
  rpc DVSResponsHandler(GenerateRandomNumberRequest) returns (DVSResultResponse) {}
}

message TaskMetadata {
  uint32 task_index = 1;
  uint32 height = 2;
  uint64 chain_id = 3;
  bytes group_numbers = 4;
  uint32 group_threshold_percentage = 5;
}

message VRFData {
  bytes vrf_value = 1;
  bytes vrf_proof = 2;
}

message GenerateRandomNumberRequest {
  option (cosmos_proto.implements_interface) = "cosmos.base.v1beta1.Msg";
  option (amino.name) = "dvs/squared/request";
  TaskMetadata task_metadata = 1;
  repeated VRFData vrf_data = 2;
}

message GenerateRandomNumberResponse {
  option (cosmos_proto.implements_interface) = "cosmos.base.v1beta1.Msg";
  uint32 task_index = 1;
  repeated string randomNumber = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message DVSResultResponse {}
