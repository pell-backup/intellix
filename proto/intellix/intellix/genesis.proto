syntax = "proto3";
package intellix.intellix;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "intellix/intellix/params.proto";

option go_package = "intellix/x/intellix/types";

// GenesisState defines the intellix module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
