name: Test
on:
  workflow_dispatch:  # allow running workflow manually
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**.go"

concurrency: 
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Setup new work dir
        id: setup_new_work_dir
        run: |
          CLEAN_WORKFLOW_NAME=$(echo "${{ github.workflow }}" | tr -cs '[:alnum:]' '_')
          CLEAN_JOB_NAME=$(echo "${{ github.job }}" | tr -cs '[:alnum:]' '_')
          echo "NEW_WORK_DIR=./codes/${CLEAN_WORKFLOW_NAME}/${CLEAN_JOB_NAME}" >> $GITHUB_ENV
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - uses: actions/checkout@v4
        with:
          path: ${{ env.NEW_WORK_DIR }}
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.workflow_sha }}
      - name: setup go private modules
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global url."https://${GITHUB_TOKEN}:x-oauth-basic@github.com/0xPellNetwork".insteadOf "https://github.com/0xPellNetwork"
          git config --global url."https://${GITHUB_TOKEN}:x-oauth-basic@github.com/IntelliXLabs".insteadOf "https://github.com/IntelliXLabs"
      - name: download go modules
        run: go mod download
        working-directory: ${{ env.NEW_WORK_DIR }}
      - name: Run Go Tests
        working-directory: ${{ env.NEW_WORK_DIR }}
        run: |
          make test-in-ci
