name: intellix

services:

  dispatcher:
    image: intellixlabs-intellix-operator:latest
    environment:
      - ETH_RPC_URL=${SERVICE_CHAIN_RPC_URL}
      - ETH_WS_URL=${SERVICE_CHAIN_WS_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    entrypoint: [ "bash", "/root/scripts/start_dispatcher.sh" ]
    ports:
      - "3345:${DEBUG_PORT:-2345}"
    volumes:
      - ./operator:/root/scripts

  operator:
    image: intellixlabs-intellix-operator:latest
    environment:
      - ETH_RPC_URL=${ETH_RPC_URL}
      - ETH_WS_URL=${ETH_WS_URL}
      - GATEWAY_ADDR=${GATEWAY_ADDR:-gateway:8949}
      - OPERATOR_KEY=${OPERATOR_KEY}
      - OPERATOR_KEY_MNEMONIC=${OPERATOR_KEY_MNEMONIC}
      - ROOT_KEY=${ROOT_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - REGISTRY_ROUTER_ADDRESS=${REGISTRY_ROUTER_ADDRESS}
    ports:
      - "3346:${DEBUG_PORT:-2345}"
    depends_on:
      abci:
        condition: service_started
    entrypoint: [ "bash", "/root/scripts/start_operator.sh" ]
    volumes:
      - ./.operator:/root/.pelldvs
      - ./operator:/root/scripts

networks:
  default:
    external: true
    name: intellix-devnet
