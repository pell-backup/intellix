name: intellixlabs-intellix

services:
  hardhat:
    build:
      context: ./
      dockerfile: ./contracts/Dockerfile
      args:
        - HTTP_PROXY=$HTTP_PROXY
        - HTTPS_PROXY=$HTTPS_PROXY
        - GITHUB_TOKEN=$GITHUB_TOKEN
        - CONTRACT_VERSION=${CONTRACT_VERSION:-v0.4.0}
      tags:
        - hardhat:${CONTRACT_VERSION:-v0.4.0}

  pelldvs:
    build:
      context: ./
      dockerfile: ./pelldvs/Dockerfile
      args:
        - HTTP_PROXY=$HTTP_PROXY
        - HTTPS_PROXY=$HTTPS_PROXY
        - GITHUB_TOKEN=$GITHUB_TOKEN
        - PELLDVS_VERSION=${PELLDVS_VERSION:-v0.1.10}

  operator:
    build:
      context: ../
      dockerfile: ./docker/operator/Dockerfile
      args:
        - HTTP_PROXY=$HTTP_PROXY
        - HTTPS_PROXY=$HTTPS_PROXY
        - GITHUB_TOKEN=$GITHUB_TOKEN
        - PELLDVS_VERSION=${PELLDVS_VERSION:-v0.1.10}
        - DEBUG_ENABLED=${DEBUG_ENABLED:-false}
